<div class="min-h-screen bg-[#0b0b18] text-[#e8e8f0] font-['DM_Sans',sans-serif] flex items-center justify-center p-4">

  <div class="absolute inset-0 opacity-[0.025]"
       style="background-image: linear-gradient(#f59e0b 1px, transparent 1px),
              linear-gradient(90deg, #f59e0b 1px, transparent 1px);
              background-size: 48px 48px;"></div>

  <div class="relative w-full max-w-md">

    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center">
        <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <span class="text-sm font-bold tracking-widest text-gray-300 uppercase">PKI System</span>
    </div>

    @if (isEmailSent) {
      <div class="bg-[#0f1320] border border-amber-700/40 rounded-xl p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-amber-500/20 border border-amber-500/30 flex items-center justify-center mx-auto mb-5">
          <svg class="w-7 h-7 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h2 class="text-lg font-bold text-white mb-2">Check your email</h2>
        <p class="text-sm text-gray-400">
          If an account with this address exists, we will send you a password reset link.
        </p>
      </div>
    }

    @if (!isEmailSent) {
      <div class="bg-[#0f1320] border border-gray-800 rounded-xl shadow-2xl overflow-hidden">
        <div class="px-6 pt-6 pb-4 border-b border-gray-800">
          <h1 class="text-lg font-bold text-white">Forgot password</h1>
          <p class="text-xs text-gray-500 mt-1">Enter the email address for your account</p>
        </div>
        <div class="px-6 py-5 space-y-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Email address</label>
            <input type="email" [(ngModel)]="email" name="email"
                   placeholder="user@email.com"
                   class="w-full bg-gray-800/60 border border-gray-700 rounded text-sm text-gray-300
                          placeholder-gray-600 px-3 py-2.5 focus:outline-none focus:border-amber-500/60
                          transition-colors" />
          </div>
          <button (click)="sendResetEmail()" [disabled]="!email || isLoading"
                  class="w-full py-2.5 text-xs tracking-widest uppercase bg-amber-600 cursor-pointer
                         hover:bg-amber-500 disabled:opacity-30 disabled:cursor-not-allowed
                         text-white rounded transition-colors flex items-center justify-center gap-2">
            @if (isLoading) {
              <svg class="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            }
            {{ isLoading ? 'Sending...' : 'Send reset link' }}
          </button>
          <p class="text-xs text-center text-gray-600">
            <a routerLink="/login" class="text-gray-500 hover:text-gray-300 transition-colors">Back to sign in</a>
          </p>
        </div>
      </div>
    }
  </div>
</div>
