# Server settings
server.port=8443

# Database Configuration (Using variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME}

# JWT Settings
jwt.access-secret=${JWT_SECRET_KEY}
jwt.refresh-secret=${JWT_SECRET_KEY_REFRESH}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

server.ssl.key-store=${KEY_STORE_PATH}
server.ssl.key-store-password=${KEY_STORE_PASSWORD}
server.ssl.key-alias=${KEY_STORE_ALIAS}
server.ssl.key-store-type=PKCS12